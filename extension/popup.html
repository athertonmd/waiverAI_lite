<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      margin: 0;
      padding: 16px;
      color: #1a1a1a;
    }
    h1 { font-size: 16px; margin: 0 0 8px; }
    #url { word-break: break-all; color: #555; font-size: 12px; margin-bottom: 12px; }
    .btn-row { display: flex; gap: 8px; margin-bottom: 4px; }
    button {
      flex: 1;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled { background: #999 !important; cursor: not-allowed; }
    #captureFullBtn { background: #0066cc; }
    #captureRegionBtn { background: #2e7d32; }
    .hint { font-size: 11px; color: #888; margin-bottom: 10px; }
    #status { margin-top: 10px; font-size: 13px; line-height: 1.4; }
    .loading { color: #666; }
    .success { color: #1a7f37; }
    .error   { color: #cf222e; }
    a { color: #0066cc; }
  </style>
</head>
<body>
  <h1>Waiver Hub Capture</h1>
  <div id="url"></div>
  <div class="btn-row">
    <button id="captureFullBtn">📄 Full Page</button>
    <button id="captureRegionBtn">✂️ Select Region</button>
  </div>
  <div class="hint">Use "Select Region" to draw a rectangle around a single waiver on list pages.</div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
